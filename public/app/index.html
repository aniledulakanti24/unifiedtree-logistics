<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UT Log</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0F2925">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- Picks up the session token handed over by the marketing-site login. -->
  <script src="../js/token-handoff.js" data-receive></script>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('ut-theme') || 'light'; if (localStorage.getItem('ut-side') === 'rail') document.documentElement.dataset.side = 'rail'; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=10">
  <link rel="stylesheet" href="hub.css?v=17">
  <link rel="stylesheet" href="crm.css?v=16">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="shell">
    <aside class="side" id="side" aria-label="Main navigation">
      <a class="side__brand" href="#/home"><img class="side__logo" src="../assets/logo-light.svg" alt="UT Log" width="124" height="32"><img class="side__mark" src="../assets/favicon.svg" alt="UT Log" width="32" height="32"></a>
      <nav class="side__nav" id="sideNav"></nav>
      <div class="side__foot"><a href="#/help" title="Help &amp; Support"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.500 9a2.500 2.500 0 1 1 3.500 2.300c-.6.300-1 .9-1 1.600v.6M12 17h.01"/></svg><span>Help</span></a><a href="#/feedback" title="Feedback"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Feedback</span></a></div>
      <button class="side-me" id="sideMe" type="button" aria-haspopup="dialog" aria-label="Open your account"><span class="pf-av" id="sideMeAv">U</span><span class="side-me__t"><b id="sideMeName">Your account</b><small id="sideMeSub"></small></span><svg class="side-me__chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
    </aside>
    <div class="side-scrim" id="sideScrim" hidden></div>
    <div class="shell__main">
      <header class="top">
        <button class="top__icon" id="menuBtn" type="button" aria-label="Toggle sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        <button class="findBtn" id="findBtn" type="button" aria-label="Find a page or search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg><span>Search services, bookings…</span><kbd>Ctrl K</kbd></button>
        <div class="top__right">
          <button class="top-new" id="newBtn" type="button" aria-haspopup="menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
          <button class="top-ask" id="askBtn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800z"/></svg><span>Ask</span></button>
          <div class="wallet-pill" id="walletPill"><a href="#/wallet" title="Wallet balance"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2"/></svg><span id="walletBalance" translate="no">—</span></a><button id="walletAdd" type="button" aria-label="Add money to wallet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
          <button class="top__icon top__bell" id="bellBtn" type="button" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i id="bellDot" hidden></i><b class="bell-count" id="bellCount" hidden></b></button>
          <button class="top__icon" id="helpBtn" type="button" aria-haspopup="menu" aria-label="Help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.500 9a2.500 2.500 0 1 1 3.500 2.300c-.6.300-1 .9-1 1.600v.6M12 17h.01"/></svg></button>
          <button class="avatar" id="profileBtn" type="button" aria-haspopup="dialog" aria-label="Open your account">U</button>
        </div>
      </header>
      <nav class="substrip stationstrip" id="stationstrip" aria-label="Seller tools" hidden></nav>
      <nav class="substrip" id="substrip" aria-label="Pages in this section" hidden></nav>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <nav class="mtabs" aria-label="Quick navigation"><a href="#/home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a><a href="#/my/orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg><span>Orders</span></a><a class="mtabs__go" href="#/vehicle/book" aria-label="New booking"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a><a href="#/wallet"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 13h2M3 10h18"/></svg><span>Wallet</span></a><button id="mMenu" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Menu</span></button></nav>
  <div id="gtHost" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modalRoot"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
