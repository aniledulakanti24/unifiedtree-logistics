<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your delivery</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --brand: #0B5D45; --line: #E1E7E5; --ink: #101C18; --ink3: #6B7874; --soft: #E6F4EF; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #F6F8F7; color: var(--ink); }
    header { background: var(--brand); color: #fff; padding: 20px 16px 26px; }
    .wrap, main { max-width: 560px; margin: 0 auto; }
    header h1 { margin: 0; font-size: 20px; } header p { margin: 4px 0 0; opacity: .85; font-size: 14px; }
    main { padding: 0 16px 32px; margin-top: -14px; display: grid; gap: 12px; }
    .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    h2 { margin: 0 0 10px; font-size: 16px; }
    .status { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .status b { font-size: 18px; color: var(--brand); } .muted { color: var(--ink3); font-size: 13px; }
    .days { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; }
    .days button, .slots button, .opt { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 13.5px; cursor: pointer; color: var(--ink); }
    .days button[aria-pressed="true"], .slots button[aria-pressed="true"], .opt.on { border-color: var(--brand); background: var(--soft); color: var(--brand); font-weight: 600; }
    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .opts { display: grid; gap: 6px; } .opt { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; }
    input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px; font: inherit; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .go { border: 0; border-radius: 10px; padding: 11px 16px; background: var(--brand); color: #fff; font: inherit; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .done { padding: 10px 12px; border-radius: 10px; background: var(--soft); color: var(--brand); font-size: 13.5px; margin-top: 8px; }
    .err { color: #B8322F; font-size: 13px; min-height: 1em; margin: 6px 0 0; }
    .lock { padding: 10px 12px; border-radius: 10px; background: #FDF1DC; color: #7A4F00; font-size: 13.5px; }
    footer { text-align: center; color: var(--ink3); font-size: 12px; padding: 8px 16px 24px; }
  </style>
</head>
<body>
  <header><div class="wrap"><h1>Your delivery</h1><p id="sub">Choose how and when you receive it.</p></div></header>
  <main id="main"><div class="card muted">Loading…</div></main>
  <footer>Sent with UT Log. Your choices go to the delivery partner; only the sender sees your phone number.</footer>
  <script>
    (function () {
      var q = new URLSearchParams(location.search); var id = q.get('id'); var k = q.get('k');
      var main = document.getElementById('main'); var day = null; var d = null;
      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      function when(iso) { return new Date(iso).toLocaleString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); }
      function dayName(s) { return new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }); }
      function post(body, okText) {
        body.id = id; body.k = k;
        return fetch('/v1/public/receiver', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || 'That did not work.'); return j; }); })
          .then(function (j) { d = j; draw(okText); })
          .catch(function (e) { var er = document.getElementById('err'); if (er) er.textContent = e.message; });
      }
      function draw(okText) {
        var p = d.prefs || {}; var pend = (d.requests || []).filter(function (x) { return x.status === 'pending'; })[0];
        var last = (d.requests || []).slice(-1)[0];
        day = day || (p.slot && p.slot.date) || d.slots[0].date;
        document.getElementById('sub').textContent = d.service + ' by ' + d.provider + ' · from ' + d.from_city;
        var lock = !d.can_change;
        var slots = d.slots.filter(function (s) { return s.date === day; })[0].slots;
        main.innerHTML =
          '<section class="card"><div class="status"><div><b>' + esc(d.label) + '</b><div class="muted">To ' + esc(d.to_area) + ' · ' + esc(d.address) + '</div></div><div class="muted">' + (d.promised_by ? 'Due ' + esc(when(d.promised_by)) : '') + '</div></div>' + (okText ? '<div class="done">' + esc(okText) + '</div>' : '') + '</section>' +
          (lock ? '<div class="lock">It is already out for delivery or delivered, so it can no longer be changed.</div>' : '') +
          (d.local ? '' : '<section class="card"><h2>Pick a delivery slot</h2><div class="days">' + d.slots.map(function (s) { return '<button type="button" data-day="' + s.date + '" aria-pressed="' + (s.date === day) + '">' + esc(dayName(s.date)) + '</button>'; }).join('') + '</div><div class="slots">' + slots.map(function (s) { var on = p.slot && p.slot.date === day && p.slot.slot === s; return '<button type="button" data-slot="' + esc(s) + '" aria-pressed="' + !!on + '" ' + (lock ? 'disabled' : '') + '>' + esc(s) + '</button>'; }).join('') + '</div><p class="muted">Free. The partner delivers in the slot you pick.</p></section>') +
          '<section class="card"><h2>If you are not in</h2><div class="opts">' +
            d.lockers.map(function (l) { var on = p.leave && p.leave.type === 'locker' && p.leave.locker === l; return '<button type="button" class="opt ' + (on ? 'on' : '') + '" data-locker="' + esc(l) + '" ' + (lock ? 'disabled' : '') + '>📦 <span>' + esc(l) + (on && p.leave.code ? '<br><span class="muted">Your pickup code: <b>' + esc(p.leave.code) + '</b></span>' : '') + '</span></button>'; }).join('') +
          '</div><p class="muted" style="margin:10px 0 4px">Or leave it with a neighbour</p><div class="row"><input id="nbName" placeholder="Their name" value="' + esc(p.leave && p.leave.type === 'neighbour' ? p.leave.name : '') + '"><input id="nbFlat" placeholder="Flat or house no." value="' + esc(p.leave && p.leave.type === 'neighbour' ? p.leave.flat : '') + '"></div><button class="go" type="button" id="nbGo" ' + (lock ? 'disabled' : '') + '>Save neighbour</button>' + (p.leave ? ' <button class="go" type="button" id="clr" style="background:#fff;color:#0B5D45;border:1px solid #E1E7E5">I will be in</button>' : '') + '</section>' +
          '<section class="card"><h2>Instructions for the rider</h2><textarea id="note" rows="2" maxlength="160" placeholder="e.g. Ring the bell twice, gate code 1234">' + esc(p.note ? p.note.text : '') + '</textarea><button class="go" type="button" id="noteGo" ' + (lock ? 'disabled' : '') + '>Save instructions</button></section>' +
          '<section class="card"><h2>Deliver to a different address</h2>' + (pend ? '<div class="done">Waiting for the sender to approve: ' + esc(pend.address) + '</div>' : (last && last.status !== 'pending' ? '<p class="muted">Your last request was ' + esc(last.status) + '.</p>' : '') + '<textarea id="addr" rows="2" placeholder="Full new address"></textarea><p class="muted">The sender approves and pays the re-route fee (₹' + d.reroute_fee + ').</p><button class="go" type="button" id="addrGo" ' + (lock ? 'disabled' : '') + '>Ask the sender</button>') + '</section>' +
          (d.delivered || d.status === 'OUT_FOR_DELIVERY' ? '<section class="card"><h2>Arrived damaged?</h2>' + (d.damage ? '<div class="done">Reported. A claim has been filed for the sender; you do not need to do anything else.</div>' : '<textarea id="dmg" rows="2" placeholder="What is damaged? e.g. box crushed, 2 bottles broken"></textarea><button class="go" type="button" id="dmgGo">Report damage</button>') + '</section>' : '') +
          '<p class="err" id="err" role="alert"></p>';
        main.onclick = function (e) {
          var t = e.target.closest('button'); if (!t || t.disabled) return;
          if (t.dataset.day) { day = t.dataset.day; draw(); return; }
          if (t.dataset.slot) return post({ action: 'slot', date: day, slot: t.dataset.slot }, 'Slot saved: ' + dayName(day) + ', ' + t.dataset.slot);
          if (t.dataset.locker) return post({ action: 'locker', locker: t.dataset.locker }, 'It will be left at ' + t.dataset.locker + '. Use the code shown to collect it.');
          if (t.id === 'nbGo') return post({ action: 'neighbour', name: document.getElementById('nbName').value, flat: document.getElementById('nbFlat').value }, 'Saved. If you are out, it goes to your neighbour.');
          if (t.id === 'clr') return post({ action: 'clear' }, 'Saved. The rider will deliver to you.');
          if (t.id === 'noteGo') return post({ action: 'note', text: document.getElementById('note').value }, 'Instructions saved for the rider.');
          if (t.id === 'dmgGo') return post({ action: 'damage', note: document.getElementById('dmg').value }, 'Damage reported. The sender's claim is filed automatically.');
          if (t.id === 'addrGo') return post({ action: 'address', address: document.getElementById('addr').value }, 'Sent to the sender to approve.');
        };
      }
      if (!id || !k) { main.innerHTML = '<div class="card">This link is not complete. Ask the sender to share it again.</div>'; return; }
      fetch('/v1/public/receiver?id=' + encodeURIComponent(id) + '&k=' + encodeURIComponent(k))
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message); return j; }); })
        .then(function (j) { d = j; draw(); })
        .catch(function (e) { main.innerHTML = '<div class="card">' + esc(e.message || 'This link has expired.') + '</div>'; });
    })();
  </script>
</body>
</html>
